name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Detect Project Root & Build APK
        run: |
          # 1. Locate directory containing App.tsx
          APP_PATH=$(find . -name "App.tsx" ! -path "*/node_modules/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.tsx not found in repository."
            find . -maxdepth 3
            exit 1
          fi
          
          # Get the folder that contains src/ (or contains App.tsx)
          SRC_DIR=$(dirname "$APP_PATH")
          if [ "$(basename "$SRC_DIR")" = "src" ]; then
            ROOT_DIR=$(dirname "$SRC_DIR")
          else
            ROOT_DIR="$SRC_DIR"
          fi

          echo "Detected project root at: $ROOT_DIR"
          cd "$ROOT_DIR"

          # 2. Ensure src folder exists properly
          mkdir -p src
          if [ -f "App.tsx" ]; then mv App.tsx src/; fi
          if [ -f "types.ts" ]; then mv types.ts src/; fi
          if [ -f "main.tsx" ]; then mv main.tsx src/; fi
          if [ -f "index.css" ]; then mv index.css src/; fi
          if [ -d "components" ] && [ ! -d "src/components" ]; then mv components src/; fi
          if [ -d "data" ] && [ ! -d "src/data" ]; then mv data src/; fi

          # 3. Ensure valid main.tsx exists
          cat << 'EOF' > src/main.tsx
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App.tsx';
          import './index.css';

          createRoot(document.getElementById('root')!).render(
            <StrictMode>
              <App />
            </StrictMode>
          );
          EOF

          # 4. Install dependencies & build web app
          npm install
          npm run build

          # 5. Build Android Native APK via Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/android/app/build/outputs/apk/debug/*.apk'
