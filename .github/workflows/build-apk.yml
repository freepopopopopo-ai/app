name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack drivedrop.zip and Prepare Code
        run: |
          # Automatically unzip drivedrop.zip if present
          if [ -f "drivedrop.zip" ]; then
            echo "Found drivedrop.zip! Unpacking..."
            unzip -o drivedrop.zip
          fi

          # If files were extracted into a nested folder, copy them to root
          if [ -d "src" ]; then
            echo "src directory is ready!"
          else
            NESTED_SRC=$(find . -maxdepth 3 -type d -name "src" ! -path "./src" | head -n 1)
            if [ -n "$NESTED_SRC" ]; then
              echo "Found nested src in $NESTED_SRC, moving to root"
              NESTED_DIR=$(dirname "$NESTED_SRC")
              cp -r "$NESTED_DIR"/* . || true
            fi
          fi

          ls -la
          ls -la src || true

      - name: Build Web Application
        run: |
          npm install
          npm run build

      - name: Compile Native Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/android/app/build/outputs/apk/debug/*.apk'
