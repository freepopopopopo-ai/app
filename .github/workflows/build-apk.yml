name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify and Align Project Structure
        run: |
          # Ensure src directory exists and files are placed properly
          mkdir -p src
          if [ -f "main.tsx" ] && [ ! -f "src/main.tsx" ]; then
            mv main.tsx src/
          fi
          if [ -f "App.tsx" ] && [ ! -f "src/App.tsx" ]; then
            mv App.tsx src/
          fi
          if [ -f "index.css" ] && [ ! -f "src/index.css" ]; then
            mv index.css src/
          fi
          if [ -f "types.ts" ] && [ ! -f "src/types.ts" ]; then
            mv types.ts src/
          fi

          echo "Repository structure verified."
          ls -la
          ls -la src || true

      - name: Build Web Application
        run: |
          npm install
          npm run build

      - name: Build Android Native APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
