name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack Code & Build Web App
        run: |
          # Clean up conflicting root Gradle files from previous attempts
          rm -rf build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties android

          # Unpack drivedrop.zip if present
          if [ -f "drivedrop.zip" ]; then
            unzip -o drivedrop.zip
          fi

          if [ ! -d "src" ]; then
            NESTED_SRC=$(find . -maxdepth 3 -type d -name "src" ! -path "./src" | head -n 1)
            if [ -n "$NESTED_SRC" ]; then
              NESTED_DIR=$(dirname "$NESTED_SRC")
              cp -r "$NESTED_DIR"/* . || true
            fi
          fi

          npm install
          npm run build

      - name: Initialize and Fix Android Capacitor Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android

          # Fix Kotlin duplicate class conflicts in Gradle configurations
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              }
          }
          EOF

      - name: Build Android Native APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: 'android/app/build/outputs/apk/debug/*.apk'
