name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate App Folder & Build APK
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" ! -path "*/node_modules/*" | head -n 1)
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Building in: $APP_DIR"
          cd "$APP_DIR"

          npm install
          npm run build

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/android/app/build/outputs/apk/debug/*.apk'
