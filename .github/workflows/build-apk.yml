name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Assemble Complete Source Tree
        run: |
          mkdir -p src

          # 1. Locate and consolidate all components & data directories
          COMPONENTS_DIR=$(find . -type d -name "components" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$COMPONENTS_DIR" ] && [ "$COMPONENTS_DIR" != "./src/components" ]; then
            cp -r "$COMPONENTS_DIR" src/
          fi

          DATA_DIR=$(find . -type d -name "data" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$DATA_DIR" ] && [ "$DATA_DIR" != "./src/data" ]; then
            cp -r "$DATA_DIR" src/
          fi

          BACKEND_DIR=$(find . -type d -name "backend" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$BACKEND_DIR" ] && [ "$BACKEND_DIR" != "./src/backend" ]; then
            cp -r "$BACKEND_DIR" src/
          fi

          # 2. Locate and move App.tsx, types.ts, main.tsx, index.css
          APP_FILE=$(find . -name "App.tsx" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$APP_FILE" ] && [ "$APP_FILE" != "./src/App.tsx" ]; then
            cp "$APP_FILE" src/App.tsx
          fi

          TYPES_FILE=$(find . -name "types.ts" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$TYPES_FILE" ] && [ "$TYPES_FILE" != "./src/types.ts" ]; then
            cp "$TYPES_FILE" src/types.ts
          fi

          MAIN_FILE=$(find . -name "main.tsx" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$MAIN_FILE" ] && [ "$MAIN_FILE" != "./src/main.tsx" ]; then
            cp "$MAIN_FILE" src/main.tsx
          fi

          # Ensure main.tsx and index.css exist
          if [ ! -f "src/main.tsx" ]; then
            cat << 'EOF' > src/main.tsx
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App';
          import './index.css';

          createRoot(document.getElementById('root')!).render(
            <StrictMode>
              <App />
            </StrictMode>
          );
          EOF
          fi

          if [ ! -f "src/index.css" ]; then
            echo '@import "tailwindcss";' > src/index.css
          fi

          echo "=== Source Tree Ready ==="
          ls -la src/

      - name: Build Web Application
        run: |
          npm install
          npm run build

      - name: Compile Native Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/android/app/build/outputs/apk/debug/*.apk'
