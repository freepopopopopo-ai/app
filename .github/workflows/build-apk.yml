name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Locate Project Root & Build APK
        run: |
          # Check where settings.gradle.kts or build.gradle.kts lives
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -I {} dirname {})
          if [ -z "$GRADLE_ROOT" ]; then
            GRADLE_ROOT="."
          fi
          echo "Building in directory: $GRADLE_ROOT"
          cd "$GRADLE_ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/build/outputs/apk/debug/*.apk'
