name: Build DriveDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Repair Project Tree
        run: |
          mkdir -p src
          
          # Find main.tsx wherever it was uploaded and move to src/main.tsx
          MAIN_FILE=$(find . -name "main.tsx" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$MAIN_FILE" ] && [ "$MAIN_FILE" != "./src/main.tsx" ]; then
            echo "Found main.tsx at $MAIN_FILE, moving to src/main.tsx"
            mv "$MAIN_FILE" src/main.tsx
          fi

          # If main.tsx still does not exist, recreate the standard entry point
          if [ ! -f "src/main.tsx" ]; then
            echo "Creating standard src/main.tsx entry point"
            cat << 'EOF' > src/main.tsx
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App';
          import './index.css';

          createRoot(document.getElementById('root')!).render(
            <StrictMode>
              <App />
            </StrictMode>
          );
          EOF
          fi

          # If index.css does not exist, ensure it exists
          if [ ! -f "src/index.css" ]; then
            echo '@import "tailwindcss";' > src/index.css
          fi

          # Move App.tsx and types.ts if they are in root
          if [ -f "App.tsx" ]; then mv App.tsx src/; fi
          if [ -f "types.ts" ]; then mv types.ts src/; fi

      - name: Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Compile Native Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DriveDrop com.drivedrop.app --web-dir dist
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: DriveDrop-app-debug
          path: '**/android/app/build/outputs/apk/debug/*.apk'
